global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Backend EC2 Spring Boot Actuator metrics
  - job_name: 'backend-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['172.31.29.243:8080', '172.31.29.243:8081', '172.31.29.243:8082']
