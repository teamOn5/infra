services:
  # [Service Discovery: Eureka Server]
  eureka:
    image: ${DOCKER_USERNAME}/eureka:${IMAGE_TAG:-latest}
    container_name: app-eureka
    restart: always
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx192m -XX:+UseG1GC"
    deploy:
      resources:
        limits:
          memory: 256M

  # [API Gateway: Spring Cloud Gateway]
  gateway:
    image: ${DOCKER_USERNAME}/gateway:${IMAGE_TAG:-latest}
    container_name: app-gateway
    restart: always
    ports:
      - "8080:8080" # ALB 진입 포트
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseG1GC"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://172.31.29.243:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 384M

  # [Service 1: Test Service / User Service]
  test-service:
    image: ${DOCKER_USERNAME}/test-service:${IMAGE_TAG:-latest}
    container_name: app-test-service
    restart: always
    ports:
      - "8081:8080" # 게이트웨이 뒤로 이동 (8081)
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseG1GC"
      SPRING_DATASOURCE_URL: jdbc:mysql://172.31.39.86:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: "1234"
      SPRING_DATA_REDIS_HOST: 172.31.39.86
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: "1234"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 172.31.39.86:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://172.31.29.243:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 384M

  # [Service 2: Live / WebSocket Service]
  live-service:
    image: ${DOCKER_USERNAME}/live-service:${IMAGE_TAG:-latest}
    container_name: app-live-service
    restart: always
    ports:
      - "8082:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
      SPRING_DATASOURCE_URL: jdbc:mysql://172.31.39.86:3306/live_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: "1234"
      LIVEKIT_HOST: http://localhost:7880
      LIVEKIT_API_KEY: API_KEY_LIVEKIT
      LIVEKIT_API_SECRET: SECRET_LIVEKIT_KEY_2026
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 172.31.39.86:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://172.31.29.243:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 512M

  # [Service 3: Order Service]
  order-service:
    image: ${DOCKER_USERNAME}/order-service:${IMAGE_TAG:-latest}
    container_name: app-order-service
    restart: always
    ports:
      - "8083:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseG1GC"
      SPRING_DATASOURCE_URL: jdbc:mysql://172.31.39.86:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: "1234"
      SPRING_DATA_REDIS_HOST: 172.31.39.86
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: "1234"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 172.31.39.86:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://172.31.29.243:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 384M
