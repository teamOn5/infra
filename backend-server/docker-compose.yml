services:
  # 1. LiveKit SFU (WebRTC Media Server)
  livekit:
    image: livekit/livekit-server:latest
    container_name: infra-livekit
    restart: always
    network_mode: "host"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml

  # 2. Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: infra-kafka-ui
    restart: always
    ports:
      - "8900:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 172.31.39.86:9092
    deploy:
      resources:
        limits:
          memory: 512M
